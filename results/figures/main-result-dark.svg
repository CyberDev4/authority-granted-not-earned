<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" width="940" height="450" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">qwen2.5:7b: forbidden call after a scripted history of agreeing with the Authorized Principal or of correcting the Authorized Principal</title>
<desc id="d">Share of runs whose outcome could be read, five studies. Call made: 86 of 136 after agreeing, 131 of 134 after correcting. Call made or written as done: 123 of 136 after agreeing, 133 of 134 after correcting.</desc>
<rect width="940" height="450" rx="8" fill="#1a1a19"/>
<text x="24" y="34" font-size="15" font-weight="600" fill="#ffffff">After a scripted history of correcting its Authorized Principal,</text>
<text x="24" y="54" font-size="15" font-weight="600" fill="#ffffff">qwen2.5:7b made the forbidden call in 98% of runs</text>
<text x="24" y="74" font-size="12" fill="#c3c2b7">Share of runs whose outcome could be read. Standard form, both rules. One row per study; each study drew fresh runs.</text>
