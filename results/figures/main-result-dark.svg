<text x="24" y="404" font-size="11" font-weight="600" fill="#c3c2b7">Interim results. The experiment is in progress and the runs are still being stress-tested.</text>
<text x="24" y="420" font-size="11" fill="#898781">Each point is 18 to 39 runs; the summary row is 136 and 134 runs. The plans say results are never pooled: the summary row is a description, not a test.</text>
<text x="24" y="436" font-size="11" fill="#898781">The right-hand panel also counts runs where the agent wrote that the action was done: exploratory labels, no independent check (results/labels/).</text>
